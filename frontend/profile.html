<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #d0e8f7 0%, #e8f4fc 40%, #f5faff 100%);
      color: #1e3a5f;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Snow */
    .snowflakes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; overflow: hidden; }
    .snowflake { position: absolute; top: -20px; color: rgba(255,255,255,0.9); font-size: 1rem; animation: snowfall linear infinite; text-shadow: 0 0 4px rgba(174,214,241,0.7); }
    @keyframes snowfall {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      25% { transform: translateX(15px) rotate(90deg); }
      50% { transform: translateX(-10px) rotate(180deg); }
      75% { transform: translateX(20px) rotate(270deg); }
      100% { transform: translateX(-5px) rotate(360deg); top: 100vh; opacity: 0.3; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #b8d8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(46, 134, 222, 0.08);
    }

    h1, h2 {
      margin-top: 0;
      color: #1e3a5f;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #b8d8f0;
      margin: 6px 0;
      box-sizing: border-box;
      background: #f0f7ff;
      color: #1e3a5f;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #2e86de;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all .15s;
    }

    button:hover {
      background: #1b6ec2;
      transform: translateY(-1px);
    }

    a {
      color: #2e86de;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    #saveMsg {
      margin-top: 10px;
      color: #27ae60;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid #b8d8f0;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #e8f4fc;
      color: #1e3a5f;
      font-weight: 600;
    }

    tr:hover td {
      background: #f0f7ff;
    }
  </style>
</head>
<body>
  <div class="snowflakes" id="snowflakes"></div>

  <div class="container">
    <div class="card">
      <h1>❄️ My Profile</h1>
      <p><a href="./index.html">← Back to Task Board</a></p>
      <div id="profileInfo">Loading profile...</div>
    </div>

    <div class="card">
      <h2>Edit Profile</h2>
      <input id="displayName" placeholder="Display name" />
      <textarea id="bio" placeholder="Bio"></textarea>
      <input id="avatarUrl" placeholder="Avatar URL" />
      <button onclick="saveProfile()">Save Profile</button>
      <div id="saveMsg"></div>
    </div>

    <div id="adminCard" class="card" style="display:none;">
      <h2>All Users (Admin only)</h2>
      <button onclick="loadUsers()">Refresh User List</button>
      <div id="userList"></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script>
    const USER_URL = window.APP_CONFIG.USER_URL;
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    const token = localStorage.getItem('token');

    if (!token || !currentUser) {
      window.location.href = './index.html';
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${USER_URL}/api/users/me`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById('profileInfo').textContent = data.error || 'Failed to load profile';
          return;
        }

        const profile = data.profile;

        document.getElementById('profileInfo').innerHTML = `
          <strong>${profile.display_name || profile.username}</strong><br>
          Username: ${profile.username}<br>
          Email: ${profile.email}<br>
          Role: ${profile.role}<br>
          Bio: ${profile.bio || '-'}<br>
          Avatar URL: ${profile.avatar_url || '-'}
        `;

        document.getElementById('displayName').value = profile.display_name || '';
        document.getElementById('bio').value = profile.bio || '';
        document.getElementById('avatarUrl').value = profile.avatar_url || '';
      } catch (error) {
        document.getElementById('profileInfo').textContent = 'Failed to connect to user service';
      }
    }

    async function saveProfile() {
      const saveMsg = document.getElementById('saveMsg');
      saveMsg.textContent = 'Saving...';

      try {
        const res = await fetch(`${USER_URL}/api/users/me`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            display_name: document.getElementById('displayName').value,
            bio: document.getElementById('bio').value,
            avatar_url: document.getElementById('avatarUrl').value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          saveMsg.textContent = data.error || 'Failed to save profile';
          return;
        }

        saveMsg.textContent = 'Profile saved successfully';
        loadProfile();
      } catch (error) {
        saveMsg.textContent = 'Failed to connect to user service';
      }
    }

    async function loadUsers() {
      const box = document.getElementById('userList');
      box.innerHTML = 'Loading users...';

      try {
        const res = await fetch(`${USER_URL}/api/users`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await res.json();

        if (!res.ok) {
          box.textContent = data.error || 'Failed to load users';
          return;
        }

        let html = `
          <table>
            <tr>
              <th>User ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Display Name</th>
            </tr>
        `;

        data.users.forEach((user) => {
          html += `
            <tr>
              <td>${user.user_id}</td>
              <td>${user.username}</td>
              <td>${user.email}</td>
              <td>${user.role}</td>
              <td>${user.display_name || ''}</td>
            </tr>
          `;
        });

        html += `</table>`;
        box.innerHTML = html;
      } catch (error) {
        box.textContent = 'Failed to connect to user service';
      }
    }

    loadProfile();

    if (currentUser.role === 'admin') {
      document.getElementById('adminCard').style.display = 'block';
      loadUsers();
    }
  </script>

  <script>
    (function createSnow() {
      const container = document.getElementById('snowflakes');
      const snowChars = ['❄', '❅', '❆', '✻', '✼', '❉', '•'];
      for (let i = 0; i < 40; i++) {
        const f = document.createElement('div');
        f.classList.add('snowflake');
        f.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
        f.style.left = Math.random() * 100 + '%';
        f.style.fontSize = (Math.random() * 1.2 + 0.5) + 'rem';
        f.style.opacity = Math.random() * 0.7 + 0.3;
        f.style.animationDuration = (Math.random() * 8 + 5) + 's';
        f.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(f);
      }
    })();
  </script>
</body>
</html>
